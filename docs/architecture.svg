<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
  </defs>
  <rect width="1200" height="420" fill="#fafafa"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="600" fill="#263238">card-art-generator: набор карточек «под ключ»</text>

  <!-- input -->
  <rect x="30" y="150" width="170" height="110" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="115" y="185" text-anchor="middle" font-weight="600" fill="#e65100">Продюсер</text>
  <text x="115" y="210" text-anchor="middle" fill="#4e342e">тема сета</text>
  <text x="115" y="232" text-anchor="middle" fill="#4e342e">пожелания</text>

  <!-- brain -->
  <rect x="250" y="70" width="330" height="270" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="415" y="100" text-anchor="middle" font-weight="600" fill="#0d47a1">Мозг: Claude Code, скилл /card-set</text>
  <rect x="270" y="120" width="290" height="44" rx="8" fill="#fff" stroke="#90caf9"/>
  <text x="415" y="148" text-anchor="middle" font-size="13">1. План сета → plan.json (10 карт, кат. 1–5)</text>
  <rect x="270" y="174" width="290" height="44" rx="8" fill="#fff" stroke="#90caf9"/>
  <text x="415" y="202" text-anchor="middle" font-size="13">2. Промпт = стиль + шаблон категории + refs</text>
  <rect x="270" y="228" width="290" height="44" rx="8" fill="#fff" stroke="#90caf9"/>
  <text x="415" y="256" text-anchor="middle" font-size="13">4. Визуальное QA кандидатов → qa.json</text>
  <rect x="270" y="282" width="290" height="44" rx="8" fill="#fff" stroke="#90caf9"/>
  <text x="415" y="310" text-anchor="middle" font-size="13">5. Сборка вариантов + контакт-листы + отчёт</text>

  <!-- hands -->
  <rect x="640" y="70" width="270" height="270" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="775" y="100" text-anchor="middle" font-weight="600" fill="#1b5e20">Руки: бэкенд генерации</text>
  <rect x="660" y="120" width="230" height="70" rx="8" fill="#fff" stroke="#a5d6a7"/>
  <text x="775" y="146" text-anchor="middle" font-weight="600">gemini.mjs</text>
  <text x="775" y="170" text-anchor="middle" font-size="12" fill="#37474f">Gemini API + референсы, ≈$0.045 за картинку</text>
  <rect x="660" y="200" width="230" height="60" rx="8" fill="#fff" stroke="#a5d6a7"/>
  <text x="775" y="224" text-anchor="middle" font-weight="600">manual.mjs</text>
  <text x="775" y="246" text-anchor="middle" font-size="12" fill="#37474f">пакет промптов, бесплатно, руками</text>
  <rect x="660" y="270" width="230" height="50" rx="8" fill="#f5f5f5" stroke="#bdbdbd" stroke-dasharray="4 3"/>
  <text x="775" y="300" text-anchor="middle" font-size="12" fill="#757575">comfyui (заглушка, нужна GPU 12 ГБ+)</text>

  <!-- output -->
  <rect x="970" y="150" width="200" height="110" rx="12" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
  <text x="1070" y="185" text-anchor="middle" font-weight="600" fill="#880e4f">3–5 вариантов сета</text>
  <text x="1070" y="210" text-anchor="middle" fill="#4e342e">10 PNG 430×480 каждый</text>
  <text x="1070" y="232" text-anchor="middle" fill="#4e342e">контакт-листы, QA-отчёт</text>

  <!-- data -->
  <rect x="250" y="360" width="660" height="44" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
  <text x="580" y="388" text-anchor="middle" font-size="12" fill="#5d4037">Данные: styleguide/ · prompts/ · data/cards (35 референсов, категории, персонажи) · qa/checklist.md</text>

  <!-- arrows -->
  <line x1="200" y1="205" x2="250" y2="205" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="580" y1="160" x2="640" y2="160" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="610" y="140" text-anchor="middle" font-size="11" fill="#37474f">3. N кандидатов</text>
  <line x1="640" y1="240" x2="580" y2="240" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="580" y1="305" x2="970" y2="230" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
</svg>
